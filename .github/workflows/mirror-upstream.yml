name: Mirror upstream
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write

jobs:
  mirror-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - name: merge
        run: |
          git config user.name ci
          git config user.email ci@nerd.bible
          ./.github/workflows/merge-upstream.sh
